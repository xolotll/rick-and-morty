name: rick_and_morty
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  dio: ^5.0.0
  shared_preferences: ^2.0.0
  flutter_localization: ^0.4.1
  get_it: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#181818"
  image: assets/icons/app_icon.jpg

  android: true
  ios: true

  android_12:
    color: "#181818"
    image: assets/icons/app_icon.jpg

flutter:
  generate: true
  uses-material-design: true