name: rick_and_morty_yx
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  dio: ^5.0.0
  shared_preferences: ^2.0.0
  flutter_localization: ^0.4.1
  yx_scope: ^1.2.2
  yx_scope_flutter: ^1.2.0
  yx_state: ^1.0.2
